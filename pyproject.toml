[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glycotwin"
version = "1.0.0"
description = "Explainable Type 2 Diabetes Digital Twin proof of concept"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "numpy>=1.26,<3",
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
